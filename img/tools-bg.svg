<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0e11"/>
      <stop offset="1" stop-color="#131418"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e11b22"/>
      <stop offset="1" stop-color="#a2141a"/>
    </linearGradient>
  </defs>

  <!-- base -->
  <rect width="1440" height="900" fill="url(#base)"/>

  <!-- truck-wrap diagonal panels (charcoal facets) -->
  <g opacity="0.5">
    <polygon points="1440,0 1440,900 780,900" fill="#191b1f"/>
    <polygon points="1440,0 1440,560 900,900 640,900" fill="#1f2227"/>
    <polygon points="1080,0 1440,0 1440,220" fill="#16181c"/>
  </g>

  <!-- red slash accents -->
  <g>
    <polygon points="1160,0 1300,0 720,900 580,900" fill="url(#red)" opacity="0.85"/>
    <polygon points="1320,0 1400,0 900,900 820,900" fill="#e11b22" opacity="0.30"/>
    <polygon points="1080,0 1130,0 600,900 550,900" fill="#000" opacity="0.35"/>
  </g>

  <!-- faint scattered trade tools -->
  <g fill="none" stroke="#ffffff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" opacity="0.07">
    <!-- pipe -->
    <g transform="translate(70,120) rotate(-14) scale(4.4)"><path d="M3 8h6a3 3 0 0 1 3 3v2a3 3 0 0 0 3 3h6M3 5v6M21 13v6"/></g>
    <!-- bolt -->
    <g transform="translate(470,70) rotate(8) scale(4)"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z"/></g>
    <!-- flame -->
    <g transform="translate(915,150) rotate(-6) scale(4.4)"><path d="M12 3c1 3-2 4-2 7a2 2 0 0 0 4 0c2 2 3 3.5 3 6a5 5 0 0 1-10 0c0-4 5-5 5-13Z"/></g>
    <!-- snowflake -->
    <g transform="translate(1250,90) scale(3.9)"><path d="M12 2v20M4 6l16 12M20 6 4 18M9 4l3 2 3-2M9 20l3-2 3 2M4.5 9l.5 3.4M19.5 9l-.5 3.4"/></g>
    <!-- drop -->
    <g transform="translate(280,520) scale(4)"><path d="M12 3s6 6.5 6 10.5A6 6 0 0 1 6 13.5C6 9.5 12 3 12 3Z"/></g>
    <!-- drain -->
    <g transform="translate(690,560) scale(4.4)"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v17M3.5 12h17M6 6l12 12M18 6 6 18"/></g>
    <!-- wrench -->
    <g transform="translate(1090,540) rotate(18) scale(4.4)"><path d="M14.6 5.4a4 4 0 0 0-5 5.2L4 16.2 7.8 20l5.6-5.6a4 4 0 0 0 5.2-5l-2.7 2.7-2.3-.6-.6-2.3 2.6-2.6z"/></g>
    <!-- small pipe -->
    <g transform="translate(1300,660) rotate(28) scale(3.4)"><path d="M3 8h6a3 3 0 0 1 3 3v2a3 3 0 0 0 3 3h6M3 5v6M21 13v6"/></g>
    <!-- small bolt -->
    <g transform="translate(120,710) rotate(-10) scale(3.7)"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z"/></g>
  </g>
</svg>
